name: Build Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: radiocharts-docker-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building VERSION=$VERSION from SHA=${GITHUB_SHA}"

      - name: Build date
        id: build_date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/radiocharts
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RADIOCHARTS_VERSION=${{ steps.version.outputs.value }}
            RADIOCHARTS_GIT_SHA=${{ github.sha }}
            RADIOCHARTS_BUILD_DATE=${{ steps.build_date.outputs.value }}

      - name: Verify mutable latest points at this build
        shell: bash
        run: |
          echo "Build digest: ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/radiocharts:latest
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/radiocharts:${{ steps.version.outputs.value }}
          echo "Published latest + version ${{ steps.version.outputs.value }} from ${GITHUB_SHA}"
