name: Build Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# `latest` is a mutable pointer. Without concurrency, two builds started close
# together can finish out of order and an older commit may overwrite `latest`.
# Keep only the newest main build active so the newest commit wins.
concurrency:
  group: radiocharts-docker-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build date
        id: build_date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/radiocharts
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RADIOCHARTS_VERSION=${{ steps.version.outputs.value }}
            RADIOCHARTS_GIT_SHA=${{ github.sha }}
            RADIOCHARTS_BUILD_DATE=${{ steps.build_date.outputs.value }}
