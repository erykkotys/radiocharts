name: Docker + Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: radiocharts-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/radiocharts-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Android release
        working-directory: android/RadioChartsAndroid
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signed APK
        working-directory: android/RadioChartsAndroid
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare Android update payload
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp android/RadioChartsAndroid/app/build/outputs/apk/release/app-release.apk dist/android/RadioCharts.apk
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/RadioChartsAndroid/app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/RadioChartsAndroid/app/build.gradle.kts | head -1)
          SHA256=$(sha256sum dist/android/RadioCharts.apk | awk '{print $1}')
          SIZE_BYTES=$(stat -c '%s' dist/android/RadioCharts.apk)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python - <<PY
          import json
          from pathlib import Path
          payload = {
              "version_name": "${VERSION_NAME}",
              "version_code": int("${VERSION_CODE}"),
              "apk_file": "RadioCharts.apk",
              "sha256": "${SHA256}",
              "size_bytes": int("${SIZE_BYTES}"),
              "git_sha": "${GITHUB_SHA}",
              "built_at": "${BUILT_AT}",
          }
          Path("dist/android/update.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cat dist/android/update.json

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioCharts-Android-release
          path: dist/android/RadioCharts.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Docker metadata
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radiocharts" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          build-args: |
            RADIOCHARTS_VERSION=${{ env.APP_VERSION }}
            RADIOCHARTS_GIT_SHA=${{ github.sha }}
            RADIOCHARTS_BUILD_DATE=${{ env.BUILD_DATE }}
