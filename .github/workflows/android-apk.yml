name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/RadioChartsAndroid/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android/RadioChartsAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RadioCharts-Android-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioCharts-Android-debug
          path: RadioCharts-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
